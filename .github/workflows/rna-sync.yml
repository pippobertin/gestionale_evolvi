# Aggiornamento degli aiuti del Registro Nazionale Aiuti (RNA) per i clienti.
#
# Perché GitHub Actions e non Vercel Cron: rna.gov.it non accetta connessioni
# dai server Vercel (timeout di connessione sia da Washington sia da Francoforte).
#
# - ogni lunedì: rilettura degli ultimi 4 mesi (RNA registra le concessioni in ritardo)
# - il primo lunedì del mese: rilettura completa dal 2020, così i clienti nuovi
#   (o con codice fiscale/P.IVA aggiunto dopo) recuperano lo storico
# - a mano: Actions → "Aggiornamento aiuti RNA" → Run workflow, con mesi da/a facoltativi
#
# Segreti richiesti (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY

name: Aggiornamento aiuti RNA

on:
  schedule:
    - cron: '0 5 * * 1'   # lunedì alle 5:00 UTC (6 o 7 ora italiana)
  workflow_dispatch:
    inputs:
      da:
        description: 'Primo mese AAAA_MM (vuoto = automatico)'
        required: false
      a:
        description: 'Ultimo mese AAAA_MM (vuoto = mese corrente)'
        required: false

concurrency:
  group: rna-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dipendenze
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Calcolo mesi
        id: mesi
        run: |
          A="${{ github.event.inputs.a }}"
          DA="${{ github.event.inputs.da }}"
          [ -z "$A" ] && A=$(date -u +%Y_%m)
          if [ -z "$DA" ]; then
            if [ "$(date -u +%-d)" -le 7 ]; then
              DA="2020_01"                                                 # primo lunedì del mese: storico completo
            else
              DA=$(date -u -d "$(date -u +%Y-%m-01) -3 month" +%Y_%m)    # ultimi 4 mesi
            fi
          fi
          echo "da=$DA" >> "$GITHUB_OUTPUT"
          echo "a=$A" >> "$GITHUB_OUTPUT"
          echo "Mesi da $DA a $A"

      - name: Importazione
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node --experimental-strip-types scripts/rna-import.mts ${{ steps.mesi.outputs.da }} ${{ steps.mesi.outputs.a }}
